[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mea-pet"
description = "梅尔桌宠 — 一个会说话、会吐槽、会记住你的桌面宠物"
dynamic = ["version"]
license = "MIT"
authors = [
    { name = "祘Il", email = "3132190387@qq.com" },
    { name = "FlexiAtom", email = "3685587367@qq.com" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "desktop-pet",
    "live2d",
    "ai-chat",
    "tts",
    "pyqt5",
    "ollama",
    "gpt-sovits",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
    "Topic :: Desktop Environment",
]

dependencies = [
    "PyQt5>=5.15.9",
    "Pillow>=10.0",
    "requests>=2.28",
    "httpx>=0.27.0",
    "websockets>=13,<16",
    "cryptography>=42",
    "mcp>=1.27,<2",
    "uvicorn>=0.30",
    "jieba>=0.42",
    "translators>=6.0.4,<7",
]

[project.optional-dependencies]
opengl = [
    "PyOpenGL>=3.1",
]
vits = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile",
    "numpy<2",
    "scipy",
    "librosa",
    "Cython",
    "pyopenjtalk-prebuilt",
    "unidecode",
    "jamo",
    "pypinyin",
    "jieba",
    "cn2an",
    "inflect",
    "eng_to_ipa",
    "ko_pron",
    "opencc",
    "indic_transliteration",
    "num_thai",
    "setuptools==69.5.1",
]
webengine = [
    "PyQtWebEngine>=5.15",
]
win32 = [
    "pywin32>=305 ; platform_system == 'Windows'",
]
linux = [
    "pillow==12.3.0",
    "PyOpenGL==3.1.10",
    "PyQt5==5.15.11",
    # meapet/desktop/fidus_position.py 是模块级 `import numpy as np` 且无兜底（其余三处
    # numpy 都在 try/except ImportError 里或走 vits extra）。两行与 linux_requirements.txt:9-10
    # 同形——1.x 在 3.13+ 没有官方 wheel，写死的 `<2` 会把「装上但运行时炸」换成「装不上」。
    "numpy>=1.21,<2.0 ; python_version < '3.13'",
    "numpy>=2.0 ; python_version >= '3.13'",
]
all = [
    "mea-pet[opengl,vits,webengine,win32,linux]",
]

[project.urls]
Homepage = "https://github.com/suan-11/mea-pet-public"
Repository = "https://github.com/suan-11/mea-pet-public"
Issues = "https://github.com/suan-11/mea-pet-public/issues"

[tool.setuptools.packages.find]
include = ["meapet*", "wizard*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "meapet.__version__" }

[tool.setuptools.package-data]
"*" = [
    "*.png",
    "*.wav",
    "*.json",
    "*.ckpt",
    "*.pth",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
    "assets/icons/*.svg",
    "assets/interaction_voices/**/*.wav",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "GPT-Sovits",
    "live2d",
    "models",
    "vits_core",
    "vits_models",
]

[tool.ruff.lint]
# P0-5 质量门渐进收紧（2026-11-14 实测，ruff 0.15.21，全仓 ruff check .）：
# 批次状态（违规数为当时 --extend-select <批> 的实测读数）：
#   E：回退 —— 548 处 / 111 文件（E501×466 为主），超 200 阈值，整批不启用；
#   F：回退 —— 237 处 / 90 文件（F401×188 为主），超 200 阈值，整批不启用；
#   W：采纳 —— 7 处 / 4 文件，存量用下方 4 条 per-file-ignores 钉住；
#   I：回退 —— 230 处 / 156 文件（全 I001），超 200 阈值且豁免清单失控；
#   B：采纳 —— 34 处 / 23 文件，存量用下方 23 条 per-file-ignores 钉住。
# 原有 E9/F63/F7/F82 保留。纪律：不改源码消违规（并行开发中）、不盲跑 --fix；
# 豁免是临时的——清理一处就删对应行，新增违规直接红。
select = ["E9", "F63", "F7", "F82", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# --- W 批存量豁免（P0-5，2026-11-14 实测；清理后请删对应行） ---
"hook-live2d.py" = ["W292"]  # 文件末尾缺换行 ×1
"meapet/desktop/renderer.py" = ["W291", "W293"]  # 尾随空格 ×1、空白行带空格 ×3
"meapet/tools/precache_interactions.py" = ["W293"]  # 空白行带空格 ×1
"tests/test_wizard_agent_config.py" = ["W293"]  # 空白行带空格 ×1
# --- B 批存量豁免（P0-5，2026-11-14 实测；清理后请删对应行） ---
# B007 未用循环变量 / B023 闭包引用循环变量 / B904 raise 缺 from / B905 zip 缺 strict
"meapet/conversation/output_protocol.py" = ["B007"]
"meapet/desktop/app.py" = ["B904"]
"meapet/desktop/dev_options.py" = ["B905"]
"meapet/desktop/qpa_guard.py" = ["B905"]
"meapet/desktop/render_host.py" = ["B905"]
"meapet/direct/client.py" = ["B023"]
"meapet/tts/service.py" = ["B007", "B023"]
"scripts/elf_section_diff.py" = ["B905"]
"scripts/fidus_positioning_probe/probe_a10_geometry.py" = ["B905"]
"scripts/fidus_positioning_probe/probe_h14_far_prior.py" = ["B023"]
"scripts/fidus_positioning_probe/probe_h22_configure_arrival.py" = ["B905"]
"scripts/fidus_positioning_probe/probe_h2_threading.py" = ["B023"]
"scripts/fidus_positioning_probe/probe_h9_frame_reuse_and_recovery.py" = ["B905"]
"scripts/fidus_positioning_probe/probe_localize.py" = ["B007"]
"scripts/fidus_positioning_probe/probe_settle_convergence.py" = ["B905"]
"scripts/layer_mode_toggle_probe.py" = ["B007"]
"scripts/live2d_canvas_measure.py" = ["B007"]
"tests/test_dev_options.py" = ["B905"]
"tests/test_direct_protocols.py" = ["B023"]
"tests/test_paid_channel_disclaimer.py" = ["B905"]
"tests/test_tts_language_routing.py" = ["B007"]
"tests/test_ui_refactor.py" = ["B905"]
"wizard/live2d_viewport.py" = ["B905"]

[tool.coverage.run]
branch = true
source = ["meapet", "wizard"]

[tool.coverage.report]
show_missing = true
skip_empty = true
