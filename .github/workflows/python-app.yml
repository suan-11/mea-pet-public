# CI for MeaPet
#
# Runs lint, syntax check, and tests across supported Python versions.
# System dependencies are installed for PyQt5 / OpenGL on Linux.
# Dependencies are installed from pyproject.toml (no requirements.txt).

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      # Use .python-version (3.12) as the primary — it's listed first in the status
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (PyQt5 / OpenGL)
      run: |
        # 1. 清理本地 apt 缓存（解决缓存损坏导致的 exit code 100）
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
          
        # 2. 恢复官方源（如果之前用 sed 改过，这里重新覆盖为官方源）
        sudo bash -c 'cat > /etc/apt/sources.list <<EOF
        deb http://archive.ubuntu.com/ubuntu $(lsb_release -cs) main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu $(lsb_release -cs)-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu $(lsb_release -cs)-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu $(lsb_release -cs)-security main restricted universe multiverse
        EOF'
          
        # 3. 更新源并安装依赖
        sudo apt-get update
        sudo apt-get install -y \
           libgl1 \
           mesa-common-dev \
           libosmesa6-dev \
            freeglut3-dev \
            libglu1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            xvfb


    - name: Install Python dependencies
      timeout-minutes: 10
      run: |
        python -m pip install --upgrade pip
        # Install core + linux extras (pins exact PyQt5 / Pillow versions for Linux)
        # pytest/ruff/pytest-cov are not runtime deps; install them explicitly for CI.
        # numpy comes in via the linux extra: pyproject pins it per Python version
        # (1.x has no 3.13 wheels, so the old explicit "numpy<2" here broke 3.13).
        # ruff pinned to the P0-5 measured version; .pre-commit-config.yaml rev matches.
        pip install -e ".[linux]"
        pip install ruff==0.15.21 pytest pytest-cov

    - name: Lint with ruff
      run: |
        python -m ruff check meapet wizard scripts tests

    - name: Syntax check with compileall
      run: |
        python -m compileall -q meapet wizard

    # Single pytest pass under Xvfb. The previous dual run
    # (plain pytest, then xvfb-run pytest --forked) doubled wall time and
    # the second pass was fragile: pytest-forked depends on legacy py.process
    # and interacts poorly with QApplication / async_runtime daemon state.
    # After the f1e443c test fixes, first-pass duration recovered (~70s) but
    # the job still failed here — consistent with forked/xvfb second pass.
    - name: Test with pytest (headless)
      timeout-minutes: 20
      env:
        PYTHONDEVMODE: "1"
        QT_QPA_PLATFORM: "offscreen"
      run: |
        export MAKEFLAGS="-j1"
        export QT_QPA_PLATFORM=offscreen
        # -ra: show skip/xfail reasons; --tb=short keeps logs readable in Actions
        # P0-5: --cov reads [tool.coverage.*] from pyproject (source=meapet+wizard,
        # branch=true); term-missing exposes 0% blind spots. No --cov-fail-under:
        # coverage is a report at this stage, not a percentage red line.
        xvfb-run -a python -X faulthandler -m pytest -q --tb=short --cov --cov-report=term-missing

  # Windows 是产品主场（PyInstaller onedir、启动桌宠.bat），但 Linux 专属的判据
  # （layer-shell / Athena 状态根、POSIX 打包布局、Qt 平台插件闸门）必须在用例里显式
  # 划界 —— 而不是"本机红没人看见"。这个 job 就是那条界线的守门人。
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      timeout-minutes: 10
      run: |
        python -m pip install --upgrade pip
        # win32 extra 带 pywin32；numpy 是 fidus_position 的模块级依赖，pyproject 只在
        # linux/vits extras 里声明，所以和 Linux job 一样单独装（1.x 对 3.12 有轮子）。
        pip install -e ".[win32]"
        pip install ruff==0.15.21 pytest pytest-cov "numpy>=1.21,<2.0"

    - name: Lint with ruff
      run: python -m ruff check meapet wizard scripts tests

    - name: Syntax check with compileall
      run: python -m compileall -q meapet wizard

    # 单一 pass，offscreen 平台插件（PyQt5 的 Windows 轮子里带 qoffscreen.dll）。
    # 与 Linux 的 Xvfb 那一趟同语义：不建真窗口，只验布局与判据。
    - name: Test with pytest (offscreen)
      timeout-minutes: 20
      env:
        PYTHONDEVMODE: "1"
        QT_QPA_PLATFORM: "offscreen"
      run: |
        # -ra: show skip/xfail reasons; --tb=short keeps logs readable in Actions
        # P0-5: coverage wiring identical to the Linux job (see comment there).
        python -X faulthandler -m pytest -q --tb=short --cov --cov-report=term-missing


